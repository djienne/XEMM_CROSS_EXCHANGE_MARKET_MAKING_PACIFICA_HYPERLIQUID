services:
  xemm-bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: xemm-bot:latest
    container_name: xemm-bot
    restart: unless-stopped

    # Graceful shutdown: give bot time to cancel orders
    stop_grace_period: 15s
    
    # Environment variables (loaded from .env file)
    env_file:
      - .env
    
    environment:
      - RUST_LOG=info
      - RUST_BACKTRACE=1
      # Bound the tokio worker pool explicitly: the workload is two WS read
      # loops + event-driven evaluation, which two workers serve comfortably.
      - TOKIO_WORKER_THREADS=2
    
    # Volume mounts
    volumes:
      # Mount config file
      - ./config.json:/app/config.json:ro
      # Mount .env file for credentials
      - ./.env:/app/.env:ro
      # Mount logs directory (optional)
      - ./logs:/app/logs
      # Persist exposure/hedge journals (unresolved_exposure.jsonl,
      # hedge_lifecycle.jsonl) across container recreation - the startup
      # exposure recovery depends on these surviving a restart.
      - ./data:/app/data
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check (optional - checks if process is running)
    healthcheck:
      test: ["CMD", "pgrep", "-f", "xemm_rust"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Network mode (use host network or create custom network)
    # network_mode: "host"  # Uncomment if you need host network access
    
    # Resource limits. 2 CPUs so the WS read loops, signing, and the hedge
    # executor never queue behind each other on a single core (latency tail).
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '1.0'
          memory: 256M

# Optional: Create a custom network
# networks:
#   xemm-network:
#     driver: bridge
